# Example config for the host-companion service.
# Install path: C:\Program Files\Splunk\HyperVO11yCompanion\config\host-companion.yaml
# Deployed one instance per physical Hyper-V host, alongside the Splunk OTel
# Collector already running there (hypervisor-host-config.yaml).

otlp:
  endpoint: "http://localhost:4318"  # host-local Splunk OTel Collector; no credential needed here
  insecure: true

disk_map:
  build_interval: 1h
  build_timeout: 300s   # matches build-hyperv-vm-disk-map.ps1's -TimeoutSec 300; on timeout, keep the previous in-memory map

disk_metrics:
  sample_interval: 60s
  latency_scale: 1000.0  # seconds -> ms; empirically confirmed via 1,890-series real-fleet sample, see docs/known-gaps-remediation.md gap #5

guest_probe:   # Tier 1.5 — PowerShell Direct, closes gap #4 (guest filesystem used %) and gap #2 (guest memory used %, static-memory VMs)
  enabled: false   # leave false until the go/no-go criteria in docs/phase3-guest-probe-plan.md are validated
  vm_include: []   # opt-in curated subset by VM name, e.g. ["WebServer*"]; empty = no VMs probed even if enabled
  sample_interval: 5m   # PowerShell Direct sessions are heavier than local Get-Counter; sample less often
  sample_timeout: 30s   # per-VM timeout; a hung guest (missing/stale Integration Services) must not block other VMs
  credential_name: "hyperv-o11y/guest-probe"   # Windows Credential Manager generic credential, valid inside the guest
