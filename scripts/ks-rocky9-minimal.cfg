# Kickstart file for the Rocky Linux 9 guest used to validate Tier 1.6
# (internal/guestfs) end-to-end. Deliberately produces the "worst case" real
# layout that exposed the /boot-vs-root selection bug: a standard, non-LVM
# Anaconda partitioning with separate /boot and / partitions, both typed
# plain "Linux filesystem" in GPT, XFS on both. Do not add --lvm to autopart
# below - the whole point of this guest is to reproduce the non-LVM layout.
#
# Placed at the root of a volume labeled OEMDRV (see
# 04-build-rocky-oemdrv-vhd.ps1) - Anaconda auto-detects and uses it, no GRUB
# boot-parameter editing needed.

text
lang en_US.UTF-8
keyboard us
timezone America/Chicago --utc

rootpw --plaintext changeme123
user --name=testuser --password=changeme123 --plaintext --groups=wheel

network --bootproto=dhcp --device=link --activate --onboot=on

# GPT, non-LVM, separate /boot - this is the exact layout that exposed the
# guestfs FindRootFilesystem bug (both /boot and / typed "Linux filesystem",
# /boot listed first).
zerombr
clearpart --all --initlabel --disklabel=gpt
autopart --nolvm --fstype=xfs

bootloader --location=mbr

reboot

%packages --minimal
@core
%end
