# =============================================================================
# Splunk OTel Collector config — Tier 2: Hyper-V GUEST (inside each VM)
#
# ** RULED OUT FOR THIS CUSTOMER — DO NOT DEPLOY, OPT-IN OR OTHERWISE **
# This customer has explicitly rejected deploying any collector inside guest
# VMs, even as a curated opt-in subset — not just fleet-wide. This file is
# kept in the repo for reference (e.g. other customers who don't have this
# constraint) but is NOT part of the solution proposed to this customer. The
# guest-filesystem-used-% and static-memory-pressure gaps this file would
# have closed (see docs/known-gaps-remediation.md, gaps #4 and #2) are
# tracked as OPEN, blocked on the Tier 1.5 (PowerShell Direct guest probe)
# go/no-go decision instead — see docs/architecture.md, Tier 1.5.
#
# Historical billing context for why this was originally scoped opt-in rather
# than fleet-wide (now moot, since it's ruled out entirely): every VM running
# this collector becomes a separately-billed host. One real customer POC
# measured an order of magnitude more VMs than physical/hypervisor hosts —
# deploying Tier 2 everywhere would have multiplied the billable host count
# several-fold.
#
# REQUIRED for Tier 1 <-> Tier 2 correlation in Splunk Observability Cloud:
#   1. The guest OS hostname must match the Hyper-V VM name exactly (the name
#      shown in Hyper-V Manager / Get-VM). If they differ, override
#      `host.name` below to the Hyper-V VM name instead of relying on
#      auto-detection.
#   2. HYPERV_HOST_NAME env var must be set at deploy time to the hostname of
#      the parent Hyper-V host, so hypervisor.host.name matches Tier 1's tag
#      and the infra navigator can link VM -> parent host both ways.
# =============================================================================

receivers:
  hostmetrics:
    collection_interval: 30s
    scrapers:
      cpu:
      memory:
      disk:
      filesystem:
      network:
      paging:
      processes:

  # Optional (Windows guests only): capture the same "% Free Space" style
  # counters the Splunk Add-on for Microsoft Hyper-V used to report via its
  # PowerShell disk input (microsoft:hyperv:vm:disk), for teams that want
  # metric-name parity with the old TA. hostmetrics/filesystem above already
  # covers this on Linux and Windows guests equally, so this is optional.
  windowsperfcounters/guest_disk:
    collection_interval: 30s
    metrics:
      guest.disk.free_space:
        description: "Free space on guest logical disk (e.g. C:)"
        unit: "%"
        gauge: {}
      guest.disk.free_mb:
        description: "Free megabytes on guest logical disk"
        unit: "MBy"
        gauge: {}
    perfcounters:
      - object: "LogicalDisk"
        instances: ["*"]
        counters:
          - { name: "% Free Space", metric: guest.disk.free_space }
          - { name: "Free Megabytes", metric: guest.disk.free_mb }

processors:
  batch:
    timeout: 10s

  resourcedetection/guest:
    detectors: [env, system]
    system:
      hostname_sources: ["os"]
    override: false

  resource/guest_tag:
    attributes:
      - key: host.type
        value: "hypervisor_managed_vm"
        action: upsert
      - key: hypervisor.host.name
        value: "${env:HYPERV_HOST_NAME}"
        action: upsert

# VALIDATED (real Azure test VM, Tier 1): a generic otlphttp exporter pointed
# at https://ingest.<realm>.signalfx.com gets HTTP 404 on /v1/metrics — Splunk
# Observability Cloud's ingest does not implement the standard OTLP HTTP
# metrics path on that domain. Metrics must go through the native `signalfx`
# exporter (SignalFx protocol translation), not generic OTLP HTTP.
exporters:
  signalfx:
    access_token: "${env:SPLUNK_ACCESS_TOKEN}"
    realm: "${env:SPLUNK_REALM}"

service:
  pipelines:
    metrics:
      receivers: [hostmetrics, windowsperfcounters/guest_disk]
      processors: [resourcedetection/guest, resource/guest_tag, batch]
      exporters: [signalfx]
